<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a3d1f" />
    <title>Vesela kmetija</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="800" height="600"></canvas>

      <div id="mission-card" class="fs-quest-card">
        <div class="quest-card-top">
          <span id="quest-bang" class="quest-bang" aria-hidden="true">!</span>
          <div id="mission-title">Pripravi se!</div>
        </div>
        <label id="mission-pick-wrap" for="mission-pick">
          <span class="mission-pick-label">Naloga</span>
          <select id="mission-pick" aria-label="Izberi nalogo"></select>
        </label>
        <div id="mission-need" aria-label="Potreben priključek">
          <span id="mission-need-icon" aria-hidden="true">🪓</span>
          <span id="mission-need-label">Plug</span>
        </div>
        <div id="mission-hint">Uporabi ročico spodaj levo</div>
        <div id="mission-progress"><div id="progress-fill"></div></div>
        <button type="button" id="restart-btn">Začni znova</button>
      </div>

      <button type="button" id="garage-btn" hidden>Zamenjaj priključek</button>

      <div id="stars-badge" aria-label="Zvezdice">
        <span id="star-icon">★</span>
        <span id="stars-count">0</span>
      </div>

      <div id="tractor-bar" aria-label="Traktor">
        <div class="tractor-bar-label">Traktor</div>
        <div id="tractor-choices" class="tractor-choices"></div>
      </div>

      <div id="impl-chip" aria-label="Trenutni priključek">
        <span id="impl-chip-icon" aria-hidden="true">🔓</span>
        <span id="impl-chip-label">Brez</span>
      </div>

      <div id="implement-bar" aria-label="Priključki"></div>

      <div id="action-cluster" aria-label="Dejanja">
        <button type="button" id="action-horn" class="action-btn" title="Hupa">📯</button>
        <button type="button" id="action-cam" class="action-btn" title="Kamera">📷</button>
      </div>

      <div id="toast" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
