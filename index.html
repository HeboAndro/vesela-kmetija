<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Vesela kmetija</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="800" height="600"></canvas>

      <div id="mission-card">
        <div id="mission-title">Pripravi se!</div>
        <div id="mission-hint">Uporabi ročico spodaj levo</div>
        <div id="mission-progress"><div id="progress-fill"></div></div>
      </div>

      <div id="stars-badge" aria-label="Zvezdice">
        <span id="star-icon">★</span>
        <span id="stars-count">0</span>
      </div>

      <div id="implement-bar" aria-label="Priključki"></div>

      <div id="toast" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
