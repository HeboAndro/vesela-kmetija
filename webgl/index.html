<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Vesela kmetija 3D</title>
  </head>
  <body>
    <div id="ui">
      <h1>Vesela kmetija 3D</h1>
      <p>WASD / ročica — 3D traktor (Deutz / Goldoni / UTB / Torpedo)</p>
      <p id="hint">Priključek: <strong id="impl-label">Plug</strong></p>
    </div>
    <div id="brand-bar" aria-label="Traktor">
      <button type="button" data-brand="deutz" class="active">Deutz</button>
      <button type="button" data-brand="goldoni">Goldoni</button>
      <button type="button" data-brand="utb">UTB</button>
      <button type="button" data-brand="torpedo">Torpedo</button>
    </div>
    <div id="impl-bar" aria-label="Priključki">
      <button type="button" data-id="plug" class="active">Plug</button>
      <button type="button" data-id="balirka">Balirka</button>
      <button type="button" data-id="prikolica">Prikolica</button>
      <button type="button" data-id="vitla">Vitla</button>
    </div>
    <div id="joystick" aria-hidden="true">
      <div id="joy-base"><div id="joy-knob"></div></div>
    </div>
    <canvas id="c"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
